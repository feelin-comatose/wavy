[package]
name = "wavy-native"
version = "0.1.0"
edition = "2021"

[dependencies]
wavy-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard"] }
egui_extras = { version = "0.37" }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.18"
global-hotkey = "0.7"
serde_json = "1"
lofty = "0.25"
raw-window-handle = "0.6"
openh264 = "0.9"
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
mp4 = "0.14"
matroska-demuxer = "0.8"
self-replace = "1.5"
url = "2"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
winresource = "0.1"
