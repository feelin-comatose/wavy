[package]
name = "wavy-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
sha1_smol = "1"
dirs = "6"
ureq = { version = "3", features = ["platform-verifier"] }
tiny_http = "0.12"
discord-rich-presence = "1.1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-native-roots", "userdata"] }
regex = "1"
base64 = "0.22"
md-5 = "0.10"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
matroska-demuxer = "0.8"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

# addons: child processes die together with Wavy (job object on Windows, parent-death signal on Linux)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
