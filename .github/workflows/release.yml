# On every push to main: Wavy.exe (Windows) + Wavy.apk (Android) → one build-N release.
# N is baked into both builds — auto-update relies on it.
name: Build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # no network, under a second; includes the cases shared with Android (testdata/parity)
      - name: Tests
        run: cargo test --release -p wavy-core

      - name: Build
        run: cargo build --release -p wavy-native
        env:
          WAVY_BUILD: ${{ github.run_number }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/wavy-native.exe dist/Wavy.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Wavy-windows
          path: dist/Wavy.exe

  # Memory budget (CLAUDE.md): the Linux build plays music and video from a demo library, and its private
  # memory is measured (scripts/mem-check.py). Over 100 MB while playing music blocks the release.
  # No GPU here, so the in-process software renderer adds ~8 MB compared with a real PC.
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libxkbcommon-x11-0 xvfb xdotool ffmpeg pulseaudio

      - name: Build
        run: cargo build --release -p wavy-native

      - name: Measure
        run: python3 scripts/mem-check.py target/release/wavy-native --cycles 2

  # Small ffmpeg.exe for HEVC/10-bit/VP9/AV1 video and Opus/AC3/DTS audio (the player downloads it when needed).
  # Rebuilt only when the script changes — otherwise taken from the cache.
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: dist-ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm
          bash scripts/build-ffmpeg.sh windows dist-ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: dist-ffmpeg/ffmpeg.exe

  android:
    runs-on: ubuntu-latest
    env:
      # password for android/release.p12 (Settings → Secrets → Actions). Without it the APK isn't published:
      # otherwise the next version wouldn't install over the old one (different signature).
      HAS_KEY: ${{ secrets.WAVY_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (created on first run)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          PW: ${{ secrets.WAVY_KEYSTORE_PASSWORD }}
        run: |
          # The key is created once, encrypted with the password from the secret and committed to the repo.
          # Only the repository owner knows the password — it never needs to be shared.
          if [ ! -f release.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore release.p12 -alias wavy -keyalg RSA -keysize 3072 \
              -validity 11000 -storepass "$PW" -keypass "$PW" -dname "CN=Wavy, O=Wavy"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release.p12
            git commit -m "Android signing key (encrypted with WAVY_KEYSTORE_PASSWORD)"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*LogicTest*'

      - name: Build APK
        working-directory: android
        env:
          WAVY_KEYSTORE_PASSWORD: ${{ secrets.WAVY_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PwavyBuild=${{ github.run_number }}

      - name: Package
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Wavy.apk

      - name: No signing key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Секрет WAVY_KEYSTORE_PASSWORD не задан — APK собран, но в релиз не попадёт"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: Wavy-android
          path: dist/Wavy.apk

  release:
    needs: [windows, android, ffmpeg, memory]
    # the exe ships even if the Android build broke — so PC updates aren't blocked;
    # it doesn't ship if the memory check failed
    if: always() && needs.windows.result == 'success' && needs.memory.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wavy (сборка ${{ github.run_number }})
          make_latest: true
          body: |
            **Windows 10/11:** `Wavy.exe` — установка не нужна. SmartScreen может предупредить (exe не подписан): «Подробнее» → «Выполнить в любом случае».
            **Android 8+:** `Wavy.apk` — разреши установку из браузера/файлового менеджера. Дальше обе версии обновляются сами.
            `ffmpeg.exe` скачивать не нужно — Wavy возьмёт его сам, когда встретится видео в HEVC/VP9/AV1 или звук Opus/AC3/DTS.

            Коммит: ${{ github.sha }}
          files: dist/*
